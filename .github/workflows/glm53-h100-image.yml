name: GLM-5.3 H100 image

on:
  push:
    branches:
      - support-glm-5-3-flash
    paths:
      - .github/workflows/glm53-h100-image.yml
      - .dockerignore
      - docker/Dockerfile.glm53-h100
      - docker/glm53-h100.openvex.json
      - docker/requirements-glm53-runtime.txt
      - lightllm/**
      - setup.py
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-publish-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false
          docker-images: false

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve immutable image identity
        id: identity
        shell: bash
        run: |
          version="v1.2.0-h100-tp8-${GITHUB_SHA}"
          created="$(git show -s --format=%cI HEAD)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "created=${created}" >> "${GITHUB_OUTPUT}"
          echo "image=${REGISTRY}/${IMAGE_NAME}:${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: docker/Dockerfile.glm53-h100
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.identity.outputs.image }}
          build-args: |
            OCI_CREATED=${{ steps.identity.outputs.created }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.identity.outputs.version }}
          cache-from: type=gha,scope=glm53-h100
          cache-to: type=gha,mode=max,scope=glm53-h100

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159

      - name: Sign published digest
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE%@*}@${DIGEST}"

      - name: Attach security VEX
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate docker/glm53-h100.openvex.json \
            --type openvex \
            "${IMAGE%@*}@${DIGEST}"

      - name: Verify signature
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE%@*}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/glm53-h100-image.yml@refs/heads/support-glm-5-3-flash$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          cosign verify-attestation "${IMAGE%@*}@${DIGEST}" \
            --type openvex \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/glm53-h100-image.yml@refs/heads/support-glm-5-3-flash$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
